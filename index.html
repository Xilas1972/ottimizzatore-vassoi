<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottimizzatore Vassoi</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Package, Calculator, RotateCw, Menu, X, TrendingUp } = lucideReact;

        const TrayPackingOptimizer = () => {
            const [trayLength, setTrayLength] = useState('');
            const [trayWidth, setTrayWidth] = useState('');
            const [trayHeight, setTrayHeight] = useState('');
            const [boxLength, setBoxLength] = useState('');
            const [boxWidth, setBoxWidth] = useState('');
            const [boxHeight, setBoxHeight] = useState('');
            const [results, setResults] = useState([]);
            const [showInputs, setShowInputs] = useState(true);

            const calculateLayouts = () => {
                const tL = parseFloat(trayLength);
                const tW = parseFloat(trayWidth);
                const tH = parseFloat(trayHeight);
                const bL = parseFloat(boxLength);
                const bW = parseFloat(boxWidth);
                const bH = parseFloat(boxHeight);

                if (!tL || !tW || !tH || !bL || !bW || !bH || 
                    tL <= 0 || tW <= 0 || tH <= 0 || bL <= 0 || bW <= 0 || bH <= 0) {
                    setResults([]);
                    return;
                }

                const configurations = [
                    {
                        name: "Normale",
                        shortName: "L×W×H",
                        dimensions: { length: tL, width: tW, height: tH },
                        description: "Posizione normale"
                    },
                    {
                        name: "Ruotato 90°",
                        shortName: "W×L×H",
                        dimensions: { length: tW, width: tL, height: tH },
                        description: "Ruotato di 90°"
                    },
                    {
                        name: "Di costa L",
                        shortName: "H×W×L",
                        dimensions: { length: tH, width: tW, height: tL },
                        description: "Di costa, lato lungo su"
                    },
                    {
                        name: "Di costa W",
                        shortName: "H×L×W",
                        dimensions: { length: tH, width: tL, height: tW },
                        description: "Di costa, lato corto su"
                    },
                    {
                        name: "Costa ruot. L",
                        shortName: "W×H×L",
                        dimensions: { length: tW, width: tH, height: tL },
                        description: "Di costa ruotato L"
                    },
                    {
                        name: "Costa ruot. W",
                        shortName: "L×H×W",
                        dimensions: { length: tL, width: tH, height: tW },
                        description: "Di costa ruotato W"
                    }
                ];

                const calculatedResults = configurations.map(config => {
                    const { length, width, height } = config.dimensions;
                    
                    const fitsLength = Math.floor(bL / length);
                    const fitsWidth = Math.floor(bW / width);
                    const fitsHeight = Math.floor(bH / height);
                    
                    const totalTrays = fitsLength * fitsWidth * fitsHeight;
                    
                    const usedLength = fitsLength * length;
                    const usedWidth = fitsWidth * width;
                    const usedHeight = fitsHeight * height;
                    
                    const wastedLength = bL - usedLength;
                    const wastedWidth = bW - usedWidth;
                    const wastedHeight = bH - usedHeight;
                    
                    const totalUsedVolume = usedLength * usedWidth * usedHeight;
                    const totalBoxVolume = bL * bW * bH;
                    const efficiency = totalBoxVolume > 0 ? (totalUsedVolume / totalBoxVolume) * 100 : 0;
                    
                    return {
                        ...config,
                        fitsLength,
                        fitsWidth,
                        fitsHeight,
                        totalTrays,
                        usedSpace: { length: usedLength, width: usedWidth, height: usedHeight },
                        wastedSpace: { length: wastedLength, width: wastedWidth, height: wastedHeight },
                        efficiency: efficiency.toFixed(1)
                    };
                }).filter(result => result.totalTrays > 0)
                 .sort((a, b) => b.totalTrays - a.totalTrays);

                setResults(calculatedResults);
            };

            useEffect(() => {
                calculateLayouts();
            }, [trayLength, trayWidth, trayHeight, boxLength, boxWidth, boxHeight]);

            const formatNumber = (num) => {
                return num.toFixed(1).replace(/\.0$/, '');
            };

            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Header Mobile */}
                    <div className="bg-blue-600 text-white p-4 sticky top-0 z-10">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <Package size={24} />
                                <h1 className="text-lg font-bold">Ottimizzatore Vassoi</h1>
                            </div>
                            <button 
                                onClick={() => setShowInputs(!showInputs)}
                                className="p-2 rounded-full hover:bg-blue-700 transition-colors"
                            >
                                {showInputs ? <X size={20} /> : <Menu size={20} />}
                            </button>
                        </div>
                    </div>

                    {/* Inputs Panel */}
                    {showInputs && (
                        <div className="p-4 bg-white shadow-lg">
                            <div className="space-y-6">
                                {/* Input Vassoio */}
                                <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                    <h2 className="text-lg font-semibold text-blue-900 mb-3 flex items-center gap-2">
                                        <Calculator size={18} />
                                        Vassoio (mm)
                                    </h2>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-blue-700 mb-1">
                                                Lunghezza
                                            </label>
                                            <input
                                                type="number"
                                                value={trayLength}
                                                onChange={(e) => setTrayLength(e.target.value)}
                                                className="w-full px-2 py-2 text-sm border border-blue-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                placeholder="400"
                                                min="0"
                                                step="0.1"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-blue-700 mb-1">
                                                Larghezza
                                            </label>
                                            <input
                                                type="number"
                                                value={trayWidth}
                                                onChange={(e) => setTrayWidth(e.target.value)}
                                                className="w-full px-2 py-2 text-sm border border-blue-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                placeholder="300"
                                                min="0"
                                                step="0.1"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-blue-700 mb-1">
                                                Altezza
                                            </label>
                                            <input
                                                type="number"
                                                value={trayHeight}
                                                onChange={(e) => setTrayHeight(e.target.value)}
                                                className="w-full px-2 py-2 text-sm border border-blue-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                placeholder="50"
                                                min="0"
                                                step="0.1"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* Input Box */}
                                <div className="bg-green-50 p-4 rounded-lg border border-green-200">
                                    <h2 className="text-lg font-semibold text-green-900 mb-3 flex items-center gap-2">
                                        <Package size={18} />
                                        Box (mm)
                                    </h2>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-medium text-green-700 mb-1">
                                                Lunghezza
                                            </label>
                                            <input
                                                type="number"
                                                value={boxLength}
                                                onChange={(e) => setBoxLength(e.target.value)}
                                                className="w-full px-2 py-2 text-sm border border-green-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
                                                placeholder="1200"
                                                min="0"
                                                step="0.1"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-green-700 mb-1">
                                                Larghezza
                                            </label>
                                            <input
                                                type="number"
                                                value={boxWidth}
                                                onChange={(e) => setBoxWidth(e.target.value)}
                                                className="w-full px-2 py-2 text-sm border border-green-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
                                                placeholder="800"
                                                min="0"
                                                step="0.1"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-green-700 mb-1">
                                                Altezza
                                            </label>
                                            <input
                                                type="number"
                                                value={boxHeight}
                                                onChange={(e) => setBoxHeight(e.target.value)}
                                                className="w-full px-2 py-2 text-sm border border-green-300 rounded focus:outline-none focus:ring-2 focus:ring-green-500"
                                                placeholder="600"
                                                min="0"
                                                step="0.1"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Risultati */}
                    <div className="p-4 space-y-4">
                        {results.length > 0 ? (
                            results.map((result, index) => (
                                <div 
                                    key={index} 
                                    className={`rounded-lg border-2 ${
                                        index === 0 
                                            ? 'bg-green-50 border-green-400 shadow-lg' 
                                            : 'bg-white border-gray-200'
                                    }`}
                                >
                                    {/* Header Card */}
                                    <div className="p-4 border-b border-gray-200">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                {index === 0 && (
                                                    <div className="bg-green-500 text-white px-2 py-1 rounded-full text-xs font-bold">
                                                        TOP
                                                    </div>
                                                )}
                                                <div>
                                                    <h3 className="font-semibold text-gray-900 flex items-center gap-1">
                                                        <RotateCw size={16} className="text-purple-600" />
                                                        {result.name}
                                                    </h3>
                                                    <p className="text-xs text-gray-600">{result.description}</p>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-xl font-bold text-purple-600">
                                                    {result.totalTrays}
                                                </div>
                                                <div className="text-xs text-gray-600">
                                                    {result.efficiency}%
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Details */}
                                    <div className="p-4 space-y-3">
                                        <div className="grid grid-cols-3 gap-3 text-sm">
                                            <div className="bg-gray-50 p-3 rounded text-center">
                                                <div className="font-semibold text-gray-700">Disposizione</div>
                                                <div className="text-xs text-gray-600 mt-1">
                                                    {result.fitsLength}×{result.fitsWidth}×{result.fitsHeight}
                                                </div>
                                            </div>
                                            <div className="bg-blue-50 p-3 rounded text-center">
                                                <div className="font-semibold text-blue-700">Utilizzato</div>
                                                <div className="text-xs text-blue-600 mt-1">
                                                    {formatNumber(result.usedSpace.length)}×{formatNumber(result.usedSpace.width)}×{formatNumber(result.usedSpace.height)}
                                                </div>
                                            </div>
                                            <div className="bg-red-50 p-3 rounded text-center">
                                                <div className="font-semibold text-red-700">Sprecato</div>
                                                <div className="text-xs text-red-600 mt-1">
                                                    {formatNumber(result.wastedSpace.length)}×{formatNumber(result.wastedSpace.width)}×{formatNumber(result.wastedSpace.height)}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-gray-100 p-3 rounded">
                                            <div className="text-xs text-gray-600">
                                                <strong>Configurazione vassoio:</strong> {result.shortName}
                                                <br />
                                                {formatNumber(result.dimensions.length)} × {formatNumber(result.dimensions.width)} × {formatNumber(result.dimensions.height)} mm
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))
                        ) : (
                            <div className="text-center py-12 text-gray-500 bg-white rounded-lg">
                                <Package size={48} className="mx-auto mb-4 opacity-50" />
                                <p className="text-sm">Inserisci le dimensioni per vedere i risultati</p>
                            </div>
                        )}
                    </div>

                    {/* Footer con istruzioni */}
                    <div className="p-4 bg-gray-800 text-white text-xs">
                        <p className="text-center text-gray-300">
                            Tocca l'icona menu in alto per modificare le dimensioni
                        </p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<TrayPackingOptimizer />, document.getElementById('root'));
    </script>
</body>
</html>
